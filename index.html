</div>

<!-- PERINGATAN -->
<div id="peringatan">⚠️ TERDETEKSI KECURANGAN! ⚠️</div>

<div class="container" id="ujianContainer">
    <div class="header">
        <h1>UJIAN KIMIA KELAS XI</h1>

<script>
/* ============================================================
   SISTEM KEAMANAN: ANTI-KECURANGAN + ALARM
   ============================================================ */
let ujianAktif = true;
let pelanggaran = 0;
const MAKS_PELANGGARAN = 3;

/* ---------- WEB AUDIO API: ALARM ---------- */
let audioCtx = null;
let alarmInterval = null;

function inisialisasiAudio() {
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
        console.warn('Web Audio API tidak didukung browser ini.');
    }
}

function bunyikanAlarm() {
    if (!audioCtx) inisialisasiAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    // Hentikan alarm sebelumnya
    if (alarmInterval) clearInterval(alarmInterval);

    let hitungan = 0;
    alarmInterval = setInterval(() => {
        if (hitungan >= 8 || !ujianAktif) {
            clearInterval(alarmInterval);
            alarmInterval = null;
            return;
        }
        // Nada sirine: tinggi-rendah bergantian
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        const now = audioCtx.currentTime;
        osc.frequency.setValueAtTime(1000, now);
        osc.frequency.linearRampToValueAtTime(400, now + 0.18);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
        hitungan++;
    }, 300);
}

/* ---------- TAMPILKAN PERINGATAN ---------- */
function tampilkanPeringatan(pesan) {
    pelanggaran++;
    bunyikanAlarm();

    const el = document.getElementById('peringatan');
    el.style.display = 'block';
    el.textContent = '⚠️ KECURANGAN TERDETEKSI! (' + pelanggaran + '/' + MAKS_PELANGGARAN + ') — ' + pesan + ' ⚠️';

    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => { el.style.display = 'none'; }, 4000);

    // Jika pelanggaran mencapai batas → hentikan ujian
    if (pelanggaran >= MAKS_PELANGGARAN) {
        hentikanUjian();
    }
}

/* ---------- HENTIKAN UJIAN ---------- */
function hentikanUjian() {
    ujianAktif = false;
    bunyikanAlarm();

    setTimeout(() => {
        document.getElementById('ujianContainer').style.display = 'none';
        document.getElementById('blokirPesan').innerHTML =
            'Anda terdeteksi melakukan <strong>' + pelanggaran + ' kali</strong> tindakan kecurangan ' +
            '(keluar halaman, pindah tab, membuka aplikasi lain, atau shortcut terlarang).<br><br>' +
            'Ujian dihentikan dan <strong>tidak dapat dilanjutkan</strong>.';
        document.getElementById('blokirOverlay').style.display = 'flex';
        document.body.style.overflow = 'hidden';
        window.scrollTo(0, 0);
    }, 600);
}

/* ---------- AKTIFKAN PROTEKSI ---------- */
function aktifkanProteksi() {
    // 1. Cegah menutup / refresh halaman
    window.addEventListener('beforeunload', function (e) {
        if (!ujianAktif) return;
        e.preventDefault();
        e.returnValue = 'Ujian sedang berlangsung! Anda yakin ingin keluar?';
        return e.returnValue;
    });

    // 2. Deteksi pindah tab / minimize (visibilitychange)
    document.addEventListener('visibilitychange', function () {
        if (!ujianAktif) return;
        if (document.hidden) {
            tampilkanPeringatan('Anda meninggalkan halaman ujian / pindah tab!');
        }
    });

    // 3. Deteksi kehilangan fokus window (alt-tab, klik aplikasi lain)
    window.addEventListener('blur', function () {
        if (!ujianAktif) return;
        tampilkanPeringatan('Fokus jendela ujian hilang!');
    });

    // 4. Cegah tombol Back
    history.pushState(null, '', location.href);
    window.addEventListener('popstate', function () {
        if (!ujianAktif) return;
        history.pushState(null, '', location.href);
        tampilkanPeringatan('Tombol kembali (Back) dilarang!');
    });

    // 5. Blokir shortcut keyboard berbahaya
    document.addEventListener('keydown', function (e) {
        if (!ujianAktif) return;
        const key = e.key.toLowerCase();
        const terlarang =
            (e.ctrlKey && ['w','t','n','r','p','s','u'].includes(key)) ||
            (e.altKey && key === 'f4') ||
            (e.metaKey && ['w','t','n','q'].includes(key)) ||
            e.key === 'F5' ||
            e.key === 'F12' ||
            (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(key));

        if (terlarang) {
            e.preventDefault();
            e.stopPropagation();
            tampilkanPeringatan('Shortcut keyboard terlarang: ' + e.key);
            return false;
        }
    });

    // 6. Blokir klik kanan (context menu)
    document.addEventListener('contextmenu', function (e) {
        if (!ujianAktif) return;
        e.preventDefault();
        return false;
    });

    // 7. Blokir drag & drop (mencegah keluar via drag)
    document.addEventListener('dragstart', function (e) {
        if (!ujianAktif) return;
        e.preventDefault();
    });

    // 8. Deteksi fullscreen keluar (jika diaktifkan)
    document.addEventListener('fullscreenchange', function () {
        if (!ujianAktif) return;
        if (!document.fullscreenElement) {
            // tidak otomatis dianggap curang, tapi bisa jadi indikasi
        }
    });

    // 9. Deteksi resize ekstrem (indikasi window di-minimize)
    let lastWidth = window.innerWidth;
    let lastHeight = window.innerHeight;
    window.addEventListener('resize', function () {
        if (!ujianAktif) return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        // Jika ukuran menyusut drastis (indikasi minimize)
        if (w < lastWidth * 0.5 || h < lastHeight * 0.5) {
            tampilkanPeringatan('Jendela ujian diperkecil / diminimize!');
        }
        lastWidth = w;
        lastHeight = h;
    });
}

    html += `<div class="petunjuk">

            <li>Soal pilihan ganda: pilih <strong>satu</strong> jawaban yang paling benar.</li>
            <li>Soal pilihan ganda kompleks: pilih <strong>semua</strong> jawaban yang benar.</li>
            <li>Soal uraian: tulis jawaban lengkap dengan langkah penyelesaian.</li>
            <li>Waktu pengerjaan: <strong>90 menit</strong>.</li>
            <li>🔒 <strong>DILARANG KELUAR</strong> dari halaman ujian. Jika terdeteksi kecurangan (pindah tab, alt-tab, back, shortcut terlarang), <strong>alarm akan berbunyi</strong> dan ujian dihentikan setelah 3 pelanggaran.</li>
        </ol>
    </div>`;

    html += `<div class="section-title">BAGIAN A — PILIHAN GANDA (25 Soal)</div>`;

    soalPG.forEach((s, i) => {
        const nomor = i + 1;
        const tingkatClass = s.tingkat === 'sulit' ? 'tipe-hots' : 'tipe-pg';
        const tingkatLabel = s.tingkat === 'sulit' ? 'HOTS' : (s.tingkat === 'sedang' ? 'Sedang' : 'Mudah');
        html += `<div class="soal">
            <div class="soal-header">
                <span class="soal-nomor">Soal ${nomor}</span>
                <span class="soal-tipe ${tingkatClass}">${tingkatLabel}</span>
            </div>
            <div class="soal-text">${s.teks}</div>
            <div class="pilihan">
                ${s.pilihan.map((p, j) => {
                    const val = String.fromCharCode(65 + j);
                    return `<label>
                        <input type="radio" name="pg-${i}" value="${val}" onchange="simpanJawaban('pg', ${i}, '${val}')">
                        <span>${p}</span>
                    </label>`;
                }).join('')}
            </div>
        </div>`;
    });

    </div>`;

            <div class="soal-header">
                <span class="soal-nomor">Soal ${nomor}</span>
                <span class="soal-tipe tipe-pgk">PG Kompleks</span>
            </div>
            <div class="soal-text">${s.teks}</div>
            <div class="pilihan">
                ${s.pilihan.map((p, j) => {
                    const val = String.fromCharCode(65 + j);
                    return `<label>
                        <input type="checkbox" name="pgk-${i}" value="${val}" onchange="simpanJawabanPGK(${i})">
                        <span>${p}</span>
                    </label>`;
                }).join('')}
            </div>
        </div>`;
    });

    html += `<div class="section-title">BAGIAN C — URAIAN (5 Soal)</div>`;
    html += `<div class="petunjuk" style="background:#e8f5e9;border-left-color:#2e7d32;">
        <strong>✍️ Petunjuk:</strong> Jawablah dengan lengkap dan jelas. Tunjukkan langkah-langkah penyelesaian.
    </div>`;

    soalUraian.forEach((s, i) => {
        const nomor = 31 + i;
        html += `<div class="soal">
            <div class="soal-header">
                <span class="soal-nomor">Soal ${nomor}</span>
                <span class="soal-tipe tipe-uraian">Uraian</span>
            </div>
            <div class="soal-text">${s.teks}</div>
            <textarea class="jawaban-uraian" id="uraian-${i}" placeholder="Tulis jawaban Anda di sini..." onchange="simpanJawabanUraian(${i})"></textarea>
        </div>`;
    });

    container.innerHTML = html;
}

/* ============================================================
   PENYIMPANAN JAWABAN
   ============================================================ */
const jawabanSiswa = { pg: {}, pgk: {}, uraian: {} };

function simpanJawaban(tipe, index, value) { jawabanSiswa[tipe][index] = value; }

function simpanJawabanPGK(index) {
    const checked = document.querySelectorAll(`input[name="pgk-${index}"]:checked`);
    jawabanSiswa.pgk[index] = Array.from(checked).map(cb => cb.value).sort();
}

function simpanJawabanUraian(index) {
    jawabanSiswa.uraian[index] = document.getElementById(`uraian-${index}`).value;
}

/* ============================================================
   HITUNG SKOR
   ============================================================ */
function hitungSkor() {
    let benarPG = 0;
    let benarPGK = 0;
    let skorUraian = 0;
    let detailPG = [], detailPGK = [], detailUraian = [];

    soalPG.forEach((s, i) => {
        const jawab = jawabanSiswa.pg[i];
        const benar = jawab === s.jawaban;
        if (benar) benarPG++;
        detailPG.push({ nomor: i + 1, jawab: jawab || '-', kunci: s.jawaban, benar });
    });

    soalPGK.forEach((s, i) => {
        const jawab = jawabanSiswa.pgk[i] || [];
        const kunci = [...s.jawaban].sort();
        const benar = jawab.length === kunci.length && jawab.every((v, idx) => v === kunci[idx]);
        if (benar) benarPGK++;
        detailPGK.push({ nomor: 26 + i, jawab: jawab.join(', ') || '-', kunci: kunci.join(', '), benar });
    });

    soalUraian.forEach((s, i) => {
        const jawab = (jawabanSiswa.uraian[i] || '').toLowerCase();
        const kataKunci = s.jawaban.toLowerCase().split(/\s+/).filter(k => k.length > 4);
        let cocok = 0;
        kataKunci.forEach(k => { if (jawab.includes(k)) cocok++; });
        const persen = kataKunci.length > 0 ? cocok / kataKunci.length : 0;
        const nilai = persen >= 0.3 ? 20 : (persen >= 0.15 ? 10 : 0);
        skorUraian += nilai;
        detailUraian.push({ nomor: 31 + i, nilai, maksimal: 20 });
    });

    const skorPG = (benarPG / soalPG.length) * 50;
    const skorPGK = (benarPGK / soalPGK.length) * 20;
    const skorUraianFinal = (skorUraian / (soalUraian.length * 20)) * 30;
    const totalSkor = Math.round(skorPG + skorPGK + skorUraianFinal);

    document.getElementById('skorDisplay').textContent = totalSkor;
    document.getElementById('skorDetail').innerHTML = `
        <div class="skor-card"><h3>Pilihan Ganda</h3><p>${benarPG} / ${soalPG.length}</p></div>
        <div class="skor-card"><h3>PG Kompleks</h3><p>${benarPGK} / ${soalPGK.length}</p></div>
        <div class="skor-card"><h3>Uraian</h3><p>${skorUraian} / ${soalUraian.length * 20}</p></div>
    `;

    const feedback = document.getElementById('feedback');
    if (totalSkor >= 75) {
        feedback.className = 'feedback lulus';
        feedback.textContent = '🎉 Selamat! Anda LULUS dengan nilai ' + totalSkor + '. Pertahankan!';
    } else {
        feedback.className = 'feedback tidak-lulus';
        feedback.textContent = '📚 Nilai Anda ' + totalSkor + '. Silakan pelajari kembali materi Hidrokarbon.';
    }

    document.getElementById('hasilContainer').style.display = 'block';
    document.getElementById('hasilContainer').scrollIntoView({ behavior: 'smooth' });
    tampilkanKunci(detailPG, detailPGK, detailUraian);
}

function tampilkanKunci(detailPG, detailPGK, detailUraian) {
    const kunciContainer = document.getElementById('kunciList');
    let html = '';

    html += `<h3 style="color:#0f5132;margin:15px 0 10px;">A. Pilihan Ganda</h3>`;
    soalPG.forEach((s, i) => {
        const d = detailPG[i];
        html += `<div class="kunci-item">
            <strong>Soal ${i + 1}:</strong> Jawaban: ${d.kunci}
            ${d.jawab !== '-' ? `(Jawaban Anda: ${d.jawab})` : '(Tidak dijawab)'}
            <span class="${d.benar ? 'badge-benar' : 'badge-salah'}">${d.benar ? '✓ Benar' : '✗ Salah'}</span>
            <div class="pembahasan">📖 ${s.pembahasan}</div>
        </div>`;
    });

    html += `<h3 style="color:#7b1fa2;margin:20px 0 10px;">B. Pilihan Ganda Kompleks</h3>`;
    soalPGK.forEach((s, i) => {
        const d = detailPGK[i];
        html += `<div class="kunci-item" style="border-left-color:#7b1fa2;">
            <strong>Soal ${26 + i}:</strong> Jawaban: ${d.kunci}
            ${d.jawab !== '-' ? `(Jawaban Anda: ${d.jawab})` : '(Tidak dijawab)'}
            <span class="${d.benar ? 'badge-benar' : 'badge-salah'}">${d.benar ? '✓ Benar' : '✗ Salah'}</span>
            <div class="pembahasan">📖 ${s.pembahasan}</div>
        </div>`;
    });

    html += `<h3 style="color:#2e7d32;margin:20px 0 10px;">C. Uraian</h3>`;
    soalUraian.forEach((s, i) => {
        const d = detailUraian[i];
        html += `<div class="kunci-item" style="border-left-color:#2e7d32;">
            <strong>Soal ${31 + i}:</strong> Nilai: ${d.nilai}/20
            <div class="pembahasan"><strong>Jawaban:</strong> ${s.jawaban}<br><br><strong>Pembahasan:</strong> ${s.pembahasan}</div>
        </div>`;
    });

    kunciContainer.innerHTML = html;
    document.getElementById('kunciContainer').style.display = 'block';
}

function resetUjian() {
    jawabanSiswa.pg = {};
    jawabanSiswa.pgk = {};
    jawabanSiswa.uraian = {};
    document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
    document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
    document.querySelectorAll('.jawaban-uraian').forEach(t => t.value = '');
    document.getElementById('hasilContainer').style.display = 'none';
    document.getElementById('kunciContainer').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================
   INISIALISASI
   ============================================================ */
(function init() {
    inisialisasiAudio();
    renderSoal();
    aktifkanProteksi();

    // Aktifkan audio pada interaksi pertama pengguna
    document.addEventListener('click', function resumeAudio() {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        document.removeEventListener('click', resumeAudio);
    }, { once: true });

    document.addEventListener('keydown', function resumeAudioKey() {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        document.removeEventListener('keydown', resumeAudioKey);
    }, { once: true });
})();
</script>
